<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Treehouse Town: Doorbell Defenders</title>
<style>:root{--forest:#1f3b2a;--bark:#6b4128;--bark-dark:#3a2415;--gold:#f2b84b;--ink:#2b1a0e}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--forest);font-family:ui-rounded,"Trebuchet MS","Segoe UI",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:.75rem}
.stage{position:relative;aspect-ratio:3/2;overflow:hidden;border-radius:22px;border:5px solid var(--bark-dark);background:#000}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .45s}
.bg.on{opacity:1}
.char{position:absolute;left:50%;bottom:6%;height:50%;width:auto;transform:translateX(-50%);z-index:2;
  filter:drop-shadow(0 6px 3px rgba(0,0,0,.35));transition:left .9s ease,bottom .9s ease,height .9s ease,opacity .3s}
.char.hop{animation:hop .6s ease-out}
.char.door{left:58%;bottom:20%;height:38%}
.char.inside{left:30%;bottom:8%;height:50%}
.char.gone{opacity:0}
.char.oops{animation:wiggle .5s 2}
@keyframes hop{0%{transform:translate(-50%,50px);opacity:0}60%{transform:translate(-50%,-14px);opacity:1}100%{transform:translate(-50%,0)}}
@keyframes wiggle{25%{transform:translateX(-56%) rotate(-6deg)}75%{transform:translateX(-44%) rotate(6deg)}}
.leaf{position:absolute;z-index:3;aspect-ratio:1000/479;background:var(--leaf) center/100% 100% no-repeat;
  container-type:inline-size;filter:drop-shadow(0 4px 3px rgba(0,0,0,.3))}
.leaf.main{top:2%;left:50%;transform:translateX(-50%);width:62%}
.leaf.badge{right:1.5%;bottom:2%;width:27%}
.leaf-text{position:absolute;left:23%;right:16%;top:23%;bottom:25%;display:flex;align-items:center;justify-content:center;
  text-align:center;color:var(--ink);font-weight:800;font-size:4.4cqw;line-height:1.18}
.main .leaf-text.long{font-size:3.7cqw;line-height:1.15}
.badge .leaf-text{font-size:7.4cqw}
.paw{position:absolute;left:73%;bottom:-2%;width:15%;z-index:2;opacity:0;transform-origin:50% 100%;pointer-events:none}
.paw.act-open{animation:pawOpen 1.1s ease forwards}
.paw.act-close{animation:pawClose 1s ease forwards}
@keyframes pawOpen{0%{opacity:0;transform:translateY(40%)}30%,55%{opacity:1;transform:translateY(-70%)}85%{opacity:1;transform:translate(25%,-70%) rotate(25deg)}100%{opacity:0;transform:translate(30%,-40%) rotate(25deg)}}
@keyframes pawClose{0%{opacity:0;transform:translate(60%,-70%) rotate(30deg)}40%,75%{opacity:1;transform:translate(-5%,-70%) rotate(-8deg)}100%{opacity:0;transform:translate(0,-40%)}}
.bell{position:absolute;right:30%;top:48%;font-size:clamp(2rem,8vw,3.5rem);z-index:2;opacity:0;transform-origin:50% 0}
.bell.ring{animation:ring 1.2s ease}
@keyframes ring{0%{opacity:0}15%,85%{opacity:1}30%{transform:rotate(25deg)}50%{transform:rotate(-25deg)}70%{transform:rotate(15deg)}100%{opacity:0}}
.stage.shake::after{content:"";position:absolute;inset:0;background:rgba(190,50,30,.35);z-index:4;animation:flash .8s forwards}
@keyframes flash{to{opacity:0}}
.controls{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem;justify-content:center;min-height:100px}
.leafbtn{width:min(215px,31%);aspect-ratio:1000/479;background:var(--leaf) center/100% 100% no-repeat;border:0;cursor:pointer;
  color:var(--ink);font:inherit;font-weight:900;font-size:clamp(.78rem,2.4vw,1rem);line-height:1.1;text-align:center;
  padding:0 17% 0 21%;display:flex;align-items:center;justify-content:center;
  filter:drop-shadow(0 4px 2px rgba(0,0,0,.35));transition:transform .15s}
.leafbtn:hover{transform:scale(1.07) rotate(-2deg)}
.leafbtn:active{transform:scale(.97)}
.leafbtn:focus-visible{outline:4px solid var(--gold);outline-offset:-6px;border-radius:40px}
[hidden]{display:none!important}
.picks{position:absolute;inset:0;z-index:2;pointer-events:none}
.pick{position:absolute;bottom:3%;width:26%;background:none;border:0;padding:0;cursor:pointer;pointer-events:auto;display:flex;flex-direction:column;align-items:center;transition:transform .2s;font:inherit}
#pick-girl{left:15%}#pick-boy{right:15%}
.pick img{width:100%;height:auto;filter:drop-shadow(0 6px 3px rgba(0,0,0,.35))}
.pick:not(:disabled):hover,.pick:focus-visible{transform:translateY(-8px) scale(1.05)}
.pick:focus-visible{outline:none}.pick:disabled{cursor:default}
.tag{width:70%;aspect-ratio:1000/479;margin-top:-4%;background:var(--leaf) center/100% 100% no-repeat;display:flex;align-items:center;justify-content:center;
  padding:0 16% 0 22%;font-weight:900;color:var(--ink);font-size:clamp(.9rem,3vw,1.2rem);filter:drop-shadow(0 3px 2px rgba(0,0,0,.35))}
.pick:disabled .tag{visibility:hidden}
.leaf.inst{width:52%}.i1{top:2%;left:2%}.i2{top:30%;right:2%}.i3{top:58%;left:2%}
.char.side{left:76%;bottom:4%;height:36%}
@media (max-width:560px){
  .stage{aspect-ratio:1/1.05}
  .leaf.main{width:94%}
  .leaf.badge{width:42%}
  .char.door{left:60%}
  .pick{width:40%}#pick-girl{left:6%}#pick-boy{right:6%}
  .leaf.inst{width:78%}.i2{right:2%}
  .leafbtn{width:min(250px,64%);font-size:1.05rem}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style></head><body>
<main>
  <div id="stage" class="stage">
    <img class="bg on" id="bg-deck" alt="">
    <img class="bg" id="bg-closed" alt="">
    <img class="bg" id="bg-open" alt="">
    <img id="char" class="char" alt="">
    <div id="picks" class="picks">
      <button id="pick-girl" class="pick" disabled><img id="img-girl" alt="Girl squirrel"><span class="tag">Girl</span></button>
      <button id="pick-boy" class="pick" disabled><img id="img-boy" alt="Boy squirrel"><span class="tag">Boy</span></button>
    </div>
    <div class="leaf inst i1" hidden><div class="leaf-text">1. A visitor knocks. Read what they say.</div></div>
    <div class="leaf inst i2" hidden><div class="leaf-text">2. Safe? Open the door. Not sure? Keep it closed.</div></div>
    <div class="leaf inst i3" hidden><div class="leaf-text">3. Need help? Ring the Grown-Up Bell!</div></div>
    <div id="bell" class="bell" aria-hidden="true">🔔</div>
    <svg id="paw" class="paw" viewBox="0 0 100 180" aria-hidden="true">
      <g stroke="#3a2415" stroke-width="5" stroke-linejoin="round">
        <rect x="26" y="70" width="48" height="120" rx="22" fill="#c8874a"/>
        <ellipse cx="28" cy="30" rx="12" ry="17" fill="#c8874a"/>
        <ellipse cx="50" cy="22" rx="12" ry="18" fill="#c8874a"/>
        <ellipse cx="72" cy="30" rx="12" ry="17" fill="#c8874a"/>
        <ellipse cx="50" cy="62" rx="34" ry="38" fill="#c8874a"/>
      </g>
      <ellipse cx="50" cy="68" rx="15" ry="13" fill="#f0c9a0"/>
      <path d="M30 118h40M30 140h40" stroke="#8a5430" stroke-width="8" stroke-linecap="round"/>
    </svg>
    <div id="badge-leaf" class="leaf badge"><div id="badge-text" class="leaf-text" aria-live="polite"></div></div>
    <div id="main-leaf" class="leaf main"><div id="leaf-text" class="leaf-text" role="status" aria-live="polite"></div></div>
  </div>
  <div id="controls" class="controls">
    <button id="cont-btn" class="leafbtn" hidden>Continue</button>
    <button id="start-btn" class="leafbtn">Start</button>
    <button id="open-btn" class="leafbtn" hidden>Open the door</button>
    <button id="close-btn" class="leafbtn" hidden>Keep it closed</button>
    <button id="bell-btn" class="leafbtn" hidden>Grown-Up Bell</button>
    <button id="next-btn" class="leafbtn" hidden>Next visitor</button>
    <button id="book-btn" class="leafbtn" hidden>Critter Book</button>
    <button id="again-btn" class="leafbtn" hidden>Play again</button>
  </div>
</main>

<script>// Treehouse Town: Doorbell Defenders. All text appears on the leaves.
// Add visitors to SCENARIOS (sneaky:true = trickster, false = real friend). Keep "say" under ~90 characters.
const SCENARIOS = [
  { sneaky: true,  say: "Click my link FAST or you'll lose your prize! Hurry!!", why: "Phishing trick!", clue: "Tricksters rush you. Stop and think first." },
  { sneaky: true,  say: "I need your password to fix your account. What is it?", why: "Nobody real asks for your password.", clue: "Passwords are only for you and your grown-ups." },
  { sneaky: true,  say: "Here's a FREE game gift! Just let me install it!", why: "Surprise downloads can hide bad software.", clue: "Only download with a grown-up." },
  { sneaky: true,  say: "Hi, new friend! Where do you live? What school do you go to?", why: "Strangers shouldn't know where you live.", clue: "Keep your address and school secret online." },
  { sneaky: true,  say: "Send me a photo of you, and don't tell your grown-ups!", why: "Real friends don't ask for secrets.", clue: "A secret from grown-ups is a stop sign. Tell them!" },
  { sneaky: true,  say: "You WON! Just type your name, birthday and street to get it.", why: "Prizes that ask for private info are tricks.", clue: "Ask a grown-up before sharing anything." },
  { sneaky: false, say: "Hi, I'm Hazel, your cousin! Your grown-up said I'd drop by today.", why: "Your grown-up knew she was coming.", clue: "Safe visitors are ones grown-ups know about." },
  { sneaky: false, say: "I brought berries to share! Want to play? We can ask your grown-up.", why: "Kind, calm, and includes a grown-up.", clue: "Real friends don't mind grown-ups joining in." },
  { sneaky: false, say: "Your drawing was great! No need to reply, I just wanted to say hi.", why: "Kind words that ask for nothing.", clue: "Friendly and asks nothing? Usually safe." },
  { sneaky: false, say: "Your teacher asked me to bring the class book. Show your grown-up!", why: "A teacher your grown-up knows sent them.", clue: "If a trusted grown-up knows, it's safer." }
];
const CHARACTERS = [["owl","an owl"],["mouse","a mouse"],["fox","a fox"],["bunny","a bunny"],["frog","a frog"],
  ["crow","a crow"],["cat","a cat"],["hedgehog","a hedgehog"],["deer","a deer"],["owl2","an owl"]];
const ROUNDS = 8;

const $ = id => document.getElementById(id);
const wait = ms => new Promise(r => setTimeout(r, ms));
const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(p => p[1]);
const scenes = { deck: $("bg-deck"), closed: $("bg-closed"), open: $("bg-open") };
const ch = $("char"), paw = $("paw"), bell = $("bell"), stage = $("stage");
const btn = { cont: $("cont-btn"), start: $("start-btn"), open: $("open-btn"), shut: $("close-btn"), ring: $("bell-btn"), next: $("next-btn"), book: $("book-btn"), again: $("again-btn") };

document.documentElement.style.setProperty("--leaf", "url(" + IMG.leaf + ")");
scenes.deck.src = IMG.deck; scenes.closed.src = IMG["door-closed"]; scenes.open.src = IMG["door-open"];

$("img-girl").src = IMG.girl; $("img-boy").src = IMG.boy;
const picks = $("picks"), pickBtns = [$("pick-girl"), $("pick-boy")], inst = [...document.querySelectorAll(".inst")];
const mainLeaf = $("main-leaf"), badgeLeaf = $("badge-leaf");
let queue, i, safe, learned, page, player = "girl";

function say(text) { const t = $("leaf-text"); t.textContent = text; t.classList.toggle("long", text.length > 92); }
function badge(text) { $("badge-text").textContent = text; }
function scene(name) { for (const k in scenes) scenes[k].classList.toggle("on", k === name); }
function restart(node, cls) { node.classList.remove(cls); void node.offsetWidth; node.classList.add(cls); }
function setChar(file, cls) { ch.src = IMG[file]; ch.className = "char " + cls; }
function show(...names) { for (const k in btn) btn[k].hidden = !names.includes(k); }

function lockPicks(locked) { picks.hidden = false; pickBtns.forEach(b => b.disabled = locked); }
function leaves(main) { mainLeaf.hidden = !main; badgeLeaf.hidden = !main; inst.forEach(x => x.hidden = main); }
function intro() {
  scene("deck"); ch.className = "char gone"; leaves(true); badgeLeaf.hidden = true; lockPicks(true);
  say("Doorbell Defenders! Help keep Treehouse Town safe from sneaky visitors.");
  badge("Stop. Think. Tell!"); show("start");
}
function choose(who) {
  player = who; picks.hidden = true; leaves(false); setChar(who, "side hop");
  show("cont"); btn.cont.focus({ preventScroll: true });
}

function startGame() {
  const sneaky = shuffle(SCENARIOS.filter(s => s.sneaky)).slice(0, 5);
  const friends = shuffle(SCENARIOS.filter(s => !s.sneaky)).slice(0, 3);
  const chars = shuffle(CHARACTERS);
  queue = shuffle([...sneaky, ...friends]).map((s, n) => ({ s, c: chars[n] }));
  i = 0; safe = 0; learned = [];
  visitor();
}

function visitor() {
  const { s } = queue[i];
  paw.className = "paw"; stage.classList.remove("shake");
  scene("deck"); setChar(queue[i].c[0], "hop");
  say(s.say);
  badge("Visitor " + (i + 1) + " of " + ROUNDS + " | Safe: " + safe);
  show("open", "shut", "ring"); btn.open.focus({ preventScroll: true });
}

async function decide(choice) {
  const { s } = queue[i];
  show();
  let good, line;
  if (choice === "bell") {
    good = true;
    line = "Smart! " + (s.sneaky ? "Your grown-up spotted the trick. " : "Your grown-up says it's a friend. ") + s.clue;
    scene("closed"); ch.classList.add("gone"); restart(bell, "ring");
  } else if (choice === "open") {
    scene("closed"); restart(paw, "act-open");
    await wait(550); scene("open");
    ch.className = "char door"; await wait(300); ch.className = "char inside";
    good = !s.sneaky;
    line = (s.sneaky ? "Oops! " : "Great! ") + s.why + " " + s.clue;
    if (s.sneaky) { await wait(900); restart(stage, "shake"); restart(ch, "oops"); }
  } else {
    scene("closed"); ch.classList.add("gone"); restart(paw, "act-close");
    good = s.sneaky;
    line = (s.sneaky ? "Safe! " + s.why + " " + s.clue : "That was a real friend! " + s.why);
  }
  await wait(choice === "open" ? 900 : 700);
  if (good) safe++;
  learned.push(s.clue);
  say(line); badge("Safe so far: " + safe);
  btn.next.textContent = i + 1 < ROUNDS ? "Next visitor" : "All done!";
  show("next"); btn.next.focus({ preventScroll: true });
}

function finish() {
  scene("deck"); setChar(player, "hop"); paw.className = "paw";
  say("You kept " + safe + " of " + ROUNDS + " visitors safe! Stop. Think. Tell a grown-up.");
  badge("All done!"); show("book", "again");
}

function bookPage() {
  const tips = [...new Set(learned)];
  if (page >= tips.length) { page = 0; finish(); return; }
  say("Critter Book " + (page + 1) + "/" + tips.length + ": " + tips[page]);
  btn.next.textContent = page + 1 < tips.length ? "Next trick" : "Back";
  show("next"); page++;
}

btn.start.onclick = () => { lockPicks(false); say("Pick your Gatekeeper! Tap a squirrel."); show(); pickBtns[0].focus({ preventScroll: true }); };
pickBtns[0].onclick = () => choose("girl");
pickBtns[1].onclick = () => choose("boy");
btn.cont.onclick = () => { leaves(true); startGame(); };
btn.again.onclick = startGame;
btn.open.onclick = () => decide("open");
btn.shut.onclick = () => decide("close");
btn.ring.onclick = () => decide("bell");
btn.book.onclick = () => { page = 0; bookPage(); btn.next.dataset.mode = "book"; };
btn.next.onclick = () => {
  if (btn.next.dataset.mode === "book" && page > 0) { return bookPage(); }
  btn.next.dataset.mode = "";
  i++; i < ROUNDS ? visitor() : finish();
};
intro();
</script></body></html>
